<!-- Dock flutuante: preso ao canto, fora do fluxo da prova, empilhado em
     cima da aba do widget de suporte (ver `classesDock`). O
     `env(safe-area-inset-bottom)` evita a barra do iPhone comer a paleta. -->
<div [class]="classesDock()">
  @if (ativo()) {
    <!-- Dica curta, some junto com o modo. Não rouba foco nem clique. -->
    <!-- Mesmo par de cores dos tooltips do app: o modificador de opacidade não
         vale em cor arbitrária (`/85` sobre `var()` não compila e a pílula some). -->
    <p
      class="rounded-full bg-[var(--color-text)] px-3 py-1 text-xs font-medium text-[var(--color-surface)] shadow-md"
      aria-live="polite"
    >
      {{ dica() }}
    </p>
  }

  <div [class]="classesBarra()" role="toolbar" aria-label="Marca-texto">
    <!-- Liga/desliga o marca-texto -->
    <button
      type="button"
      [class]="classesToggle()"
      [style.background-color]="ativo() ? corDoBotao() : null"
      [style.color]="ativo() ? corDoIcone() : null"
      [attr.aria-pressed]="ativo()"
      [attr.aria-label]="ativo() ? 'Guardar o marca-texto' : 'Pegar o marca-texto'"
      [title]="ativo() ? 'Guardar o marca-texto (G)' : 'Grifar trechos (G)'"
      (click)="toggle()"
    >
      <app-ui-icon [icon]="iconGrifar" [size]="17" />
    </button>

    @if (ativo()) {
      <div class="mx-0.5 h-6 w-px shrink-0 bg-[var(--color-border)]"></div>

      <!-- Atalhos de cor -->
      @for (cor of cores; track cor) {
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-full"
          [attr.aria-pressed]="ferramenta() === cor"
          [attr.aria-label]="'Grifar em ' + rotuloDaCor(cor)"
          [title]="rotuloDaCor(cor)"
          (click)="escolher(cor)"
        >
          <span [class]="classesAmostra(cor)" [style.background-color]="cor"></span>
        </button>
      }

      <!-- Cores escolhidas no espectro: ficam à mão sem reabrir o seletor -->
      @for (cor of recentes(); track cor) {
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-full"
          [attr.aria-pressed]="ferramenta() === cor"
          [attr.aria-label]="'Grifar na cor ' + cor"
          [title]="cor"
          (click)="escolher(cor)"
        >
          <span [class]="classesAmostra(cor)" [style.background-color]="cor"></span>
        </button>
      }

      <!-- Espectro inteiro, pelo seletor do sistema. O input é o próprio
           botão (opacidade zero por cima do anel), para o clique abrir o
           seletor nativo sem precisar de gesto extra nem de biblioteca. -->
      <span class="relative flex h-9 w-9 items-center justify-center" [title]="'Escolher outra cor'">
        <span class="pointer-events-none block h-6 w-6 rounded-full ring-1 ring-black/10 bm-espectro"></span>
        <span
          class="pointer-events-none absolute block h-3 w-3 rounded-full border border-black/10"
          [style.background-color]="corDoBotao()"
        ></span>
        <input
          type="color"
          class="absolute inset-0 cursor-pointer opacity-0"
          aria-label="Escolher outra cor para grifar"
          [value]="corDoBotao()"
          (input)="escolherDoEspectro($event)"
        />
      </span>

      <!-- Borracha -->
      <button
        type="button"
        [class]="classesFerramenta(ferramenta() === 'borracha')"
        [attr.aria-pressed]="ferramenta() === 'borracha'"
        aria-label="Apagar grifos do trecho selecionado"
        title="Borracha"
        (click)="escolher('borracha')"
      >
        <app-ui-icon [icon]="iconBorracha" [size]="17" />
      </button>

      <!-- Limpar a questão inteira -->
      @if (temGrifosNaQuestao()) {
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-full text-[var(--color-text-muted)] transition-colors hover:bg-rose-50 hover:text-rose-700"
          aria-label="Limpar todos os grifos desta questão"
          title="Limpar os grifos desta questão"
          (click)="limparQuestao()"
        >
          <app-ui-icon [icon]="iconLimpar" [size]="16" />
        </button>
      }
    }
  </div>
</div>
