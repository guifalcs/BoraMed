<div class="flex flex-col items-center justify-center gap-4 py-16 px-4 text-center">
  @if (icone()) {
    <div class="flex h-16 w-16 items-center justify-center rounded-full bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
      <app-ui-icon [icon]="icone()!" [size]="32" />
    </div>
  }
  <div class="flex flex-col gap-1">
    <h3 class="text-base font-semibold text-[var(--color-text)]">{{ titulo() }}</h3>
    @if (descricao()) {
      <p class="text-sm text-[var(--color-text-muted)] max-w-sm">{{ descricao() }}</p>
    }
  </div>
  @if (labelBotao()) {
    <app-ui-button
      [label]="labelBotao()!"
      variant="secondary"
      [fullWidth]="false"
      (buttonClick)="acao.emit()"
    />
  }
</div>
