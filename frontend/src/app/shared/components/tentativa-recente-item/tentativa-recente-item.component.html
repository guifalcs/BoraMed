<a
  [routerLink]="['/dashboard/simulados', provaId(), 'tentativa', tentativaId(), 'resultado']"
  class="group -mx-4 flex items-center justify-between gap-3 border-b border-[var(--color-border)] px-4 py-3 last:border-b-0 transition-colors hover:bg-[var(--color-surface-2)]"
>
  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-medium text-[var(--color-text)] transition-colors group-hover:text-[var(--color-primary)]">
      {{ nomeProva() }}
    </p>
    <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">{{ dataRelativa() }}</p>
  </div>

  <div class="flex shrink-0 items-center gap-2">
    <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" [class]="notaBadgeClass()">
      {{ notaLabel() }}
    </span>
    <span class="text-[var(--color-text-muted)] transition-transform group-hover:translate-x-0.5 group-hover:text-[var(--color-primary)]">
      →
    </span>
  </div>
</a>
