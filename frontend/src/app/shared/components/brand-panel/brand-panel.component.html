<section class="brand-panel" aria-label="BoraMed">
  <div class="brand-top">
    <a routerLink="/" aria-label="Ir para a página inicial">
      <img class="brand-logo" src="brand/logo.webp" alt="BoraMed" />
    </a>
  </div>

  <div class="brand-story">
    <p class="brand-kicker">{{ kicker() }}</p>
    <h1 class="brand-title" [innerHTML]="titulo()"></h1>
    <p class="brand-description">{{ descricao() }}</p>

    @if (showMetrics()) {
      <div class="metrics" aria-label="Indicadores da plataforma">
        <div class="metric">
          <strong>+5k</strong>
          <span>questões para treinar</span>
        </div>
        <div class="metric">
          <strong>8</strong>
          <span>períodos cobertos</span>
        </div>
        <div class="metric">
          <strong>Todas</strong>
          <span>as provas nacionais</span>
        </div>
      </div>
    }
  </div>

  <p class="brand-footer">BoraMed é uma plataforma independente. © 2026 BoraMed</p>
</section>
