<div class="flip-frame">
  <button
    type="button"
    class="flip-card"
    [class.flip-card--virado]="virado()"
    [class.flip-card--sem-movimento]="semMovimento() || !animar()"
    [attr.aria-pressed]="virado()"
    [attr.aria-label]="
      virado() ? 'Virar card para ver a pergunta' : 'Virar card para ver a resposta'
    "
    [attr.aria-description]="virado() ? verso() : frente()"
    aria-keyshortcuts="Enter Space ArrowUp ArrowDown PageUp PageDown Home End"
    (click)="toggle($event)"
    (keydown)="rolarConteudo($event)"
  >
    <div class="flip-card__inner">
      <div
        class="flip-card__face flip-card__face--frente"
        [attr.aria-hidden]="virado()"
        [class.flip-card__face--com-imagem]="!!frenteImagemUrl()"
      >
        <div class="flip-card__scroll">
          <span class="flip-card__selo">Pergunta</span>
          <div class="flip-card__conteudo">
            @if (frenteImagemUrl()) {
              @if (erroFrente()) {
                <p class="flip-card__erro">Não foi possível carregar a imagem da pergunta.</p>
              } @else {
                <div class="flip-card__imagem-wrap">
                  <img
                    [src]="frenteImagemUrl()!"
                    alt="Imagem da pergunta"
                    class="flip-card__imagem"
                    decoding="async"
                    (error)="erroFrente.set(true)"
                  />
                </div>
              }
            }
            @if (frente()) {
              <p class="flip-card__texto {{ frenteFontClass() }}">{{ frente() }}</p>
            }
          </div>
          <span class="flip-card__dica">Pense na resposta antes de virar</span>
        </div>
      </div>
      <div
        class="flip-card__face flip-card__face--verso"
        [attr.aria-hidden]="!virado()"
        [class.flip-card__face--com-imagem]="!!versoImagemUrl()"
      >
        <div class="flip-card__scroll">
          <span class="flip-card__selo">Resposta</span>
          <div class="flip-card__conteudo">
            @if (versoImagemUrl()) {
              @if (erroVerso()) {
                <p class="flip-card__erro">Não foi possível carregar a imagem da resposta.</p>
              } @else {
                <div class="flip-card__imagem-wrap">
                  <img
                    [src]="versoImagemUrl()!"
                    alt="Imagem da resposta"
                    class="flip-card__imagem"
                    decoding="async"
                    (error)="erroVerso.set(true)"
                  />
                </div>
              }
            }
            @if (verso()) {
              <p class="flip-card__texto {{ versoFontClass() }}">{{ verso() }}</p>
            }
          </div>
          <span class="flip-card__dica">Compare com o que você lembrou</span>
        </div>
      </div>
    </div>
  </button>
  @if (imagemAtiva(); as url) {
    <button
      type="button"
      class="flip-card__zoom"
      aria-label="Ampliar imagem"
      (click)="abrirZoom(url, $event)"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
      </svg>
    </button>
  }
</div>
