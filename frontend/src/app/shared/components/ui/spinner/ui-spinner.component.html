@if (centered()) {
  <div
    class="flex flex-col items-center justify-center gap-3 py-10"
    role="status"
    [attr.aria-label]="ariaLabel()"
  >
    <span
      class="animate-spin rounded-full border-[var(--color-primary)] border-t-transparent"
      [class]="circleClass()"
    ></span>
    @if (label()) {
      <span class="text-sm font-medium text-[var(--color-text-muted)]">{{ label() }}</span>
    }
  </div>
} @else {
  <span
    class="inline-block animate-spin rounded-full border-[var(--color-primary)] border-t-transparent align-[-0.125em]"
    [class]="circleClass()"
    role="status"
    [attr.aria-label]="ariaLabel()"
  ></span>
}
