<div
  class="ui-segmented"
  [class.ui-segmented--disabled]="disabled()"
  role="radiogroup"
  [attr.aria-label]="ariaLabel()"
>
  <span
    class="ui-segmented__indicator"
    aria-hidden="true"
    [style.width.%]="indicatorWidthPct()"
    [style.transform]="'translateX(' + (selectedIndex() * 100) + '%)'"
  ></span>

  @for (option of options(); track option.value) {
    <button
      type="button"
      class="ui-segmented__option"
      role="radio"
      [attr.aria-checked]="option.value === value()"
      [attr.aria-pressed]="option.value === value()"
      [class.ui-segmented__option--active]="option.value === value()"
      [disabled]="disabled()"
      (click)="select(option)"
    >
      <span class="ui-segmented__label">{{ option.label }}</span>
      @if (option.badge) {
        <span class="ui-segmented__badge">{{ option.badge }}</span>
      }
    </button>
  }
</div>
