@if (temConteudo()) {
  <div class="mt-4 rounded-lg border border-sky-200 bg-sky-50 p-4">
    <h4 class="mb-2 text-sm font-semibold text-sky-800">Resposta padrão</h4>

    @if (respostaModelo()) {
      <div class="text-sm leading-relaxed text-sky-900">
        <markdown [data]="respostaModelo()!"></markdown>
      </div>
    }

    @if (pontosChave().length > 0) {
      <div class="mt-3 border-t border-sky-200 pt-2">
        <h5 class="mb-1 text-xs font-semibold text-sky-700">Pontos-chave esperados</h5>
        <ul class="list-disc pl-5">
          @for (ponto of pontosChave(); track ponto) {
            <li class="text-sm text-sky-900">{{ ponto }}</li>
          }
        </ul>
      </div>
    }
  </div>
}
