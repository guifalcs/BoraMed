@if (aberto() && conteudo(); as texto) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm"
    (click)="fechar()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="texto.titulo"
  >
    <div
      class="w-full max-w-md overflow-hidden rounded-2xl bg-[var(--color-surface)] shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <!-- Cabeçalho no gradiente institucional -->
      <div class="relative px-6 py-6 text-white" [style.background]="GRADIENTE">
        <div class="pointer-events-none absolute inset-0" [style.background]="HIGHLIGHTS"></div>

        <button
          type="button"
          class="absolute right-3 top-3 flex h-8 w-8 items-center justify-center rounded-lg text-white/70 transition-colors hover:bg-white/15 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/70"
          aria-label="Fechar"
          (click)="fechar()"
        >
          <app-ui-icon [icon]="closeIcon" [size]="18" />
        </button>

        <div
          class="relative mb-3 flex h-11 w-11 items-center justify-center rounded-xl bg-white/20 backdrop-blur-sm"
        >
          <app-ui-icon [icon]="sparklesIcon" [size]="22" />
        </div>

        <h2 class="relative pr-8 text-xl font-bold leading-tight">{{ texto.titulo }}</h2>
        <p class="relative mt-1.5 text-sm leading-relaxed text-white/80">{{ texto.subtitulo }}</p>
      </div>

      <!-- Benefícios: matador primeiro, diferencial por último (posição serial) -->
      <div class="px-6 py-5">
        <ul class="space-y-2.5">
          @for (beneficio of texto.beneficios; track beneficio) {
            <li class="flex items-start gap-2.5">
              <span
                class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"
              >
                <app-ui-icon [icon]="checkIcon" [size]="11" />
              </span>
              <span class="text-sm leading-snug text-[var(--color-text)]">{{ beneficio }}</span>
            </li>
          }
        </ul>

        <p
          class="mt-4 rounded-lg bg-[var(--color-surface-2)] px-3 py-2.5 text-xs font-medium leading-snug text-[var(--color-text-muted)]"
        >
          {{ texto.fechamento }}
        </p>

        <div class="mt-5 flex flex-col gap-2">
          <button
            type="button"
            class="flex min-h-12 w-full items-center justify-center rounded-lg bg-[var(--color-action)] px-4 text-sm font-bold text-white shadow-[0_10px_20px_rgba(37,84,220,.18)] transition-transform hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-action)] focus-visible:ring-offset-2"
            (click)="irParaPlanos()"
          >
            {{ texto.cta }}
          </button>
          <button
            type="button"
            class="w-full rounded-lg px-4 py-2 text-sm font-semibold text-[var(--color-text-muted)] transition-colors hover:bg-[var(--color-surface-2)]"
            (click)="fechar()"
          >
            Agora não
          </button>
        </div>
      </div>
    </div>
  </div>
}
