<a
  routerLink="/dashboard/competitivo"
  class="animate-breathe flex items-center gap-3 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-blue-700 shadow-sm transition-colors hover:bg-blue-100"
>
  <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white text-blue-600">
    <app-ui-icon [icon]="trophyIcon" [size]="18" />
  </div>
  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-semibold">{{ statusText() }}</p>
    @if (posicaoSemana(); as semana) {
      <p class="mt-0.5 text-xs text-blue-600">Ranking semanal: #{{ semana }}</p>
    }
  </div>
</a>
