<article class="deck" [attr.aria-label]="deck().titulo" [attr.aria-busy]="ocupado()">
  <button
    type="button"
    class="deck-study"
    [disabled]="ocupado() || deck().cards_count === 0"
    [attr.aria-label]="'Estudar deck: ' + deck().titulo"
    (click)="estudar.emit(deck().id)"
  >
    <span class="deck-top">
      <span class="deck-icon"><app-ui-icon [icon]="layersIcon" [size]="21" /></span>
      @if (isOficial()) {
        <span class="deck-badge deck-badge--oficial">Oficial</span>
      } @else if (isPublico() || isFeed()) {
        <span class="deck-badge"><app-ui-icon [icon]="usersIcon" [size]="12" />Público</span>
      } @else {
        <span class="deck-badge deck-badge--privado"
          ><app-ui-icon [icon]="lockIcon" [size]="12" />Privado</span
        >
      }
    </span>
    <h3 class="deck-title">{{ deck().titulo }}</h3>
    @if (deck().descricao) {
      <span class="deck-description" [title]="deck().descricao ?? ''">{{ deck().descricao }}</span>
    }
    @if (mostrarAutor()) {
      <span class="deck-author"
        >{{ autorNome() ? 'Por ' + autorNome() : 'Equipe BoraMed' }}
        <span aria-hidden="true">·</span> {{ deck().criado_em | timeAgo }}</span
      >
    }
    <span class="deck-study-bottom"
      ><span
        >{{ fmtNumero(deck().cards_count) }} {{ deck().cards_count === 1 ? 'card' : 'cards' }}</span
      ><span class="deck-cta">{{ deck().cards_count ? 'Estudar →' : 'Sem cards' }}</span></span
    >
  </button>
  @if (isFeed() || podeCurtir() || mostrarAcoes() || (!isOficial() && deck().likes_count > 0)) {
    <footer class="deck-actions">
      <div class="deck-social">
        @if (isFeed() || podeCurtir()) {
          <button
            type="button"
            class="deck-like bm-press"
            [class.is-liked]="curtidoPorMim()"
            [disabled]="ocupado()"
            [attr.aria-pressed]="curtidoPorMim()"
            [attr.aria-label]="curtidoPorMim() ? 'Descurtir deck' : 'Curtir deck'"
            (click)="handleToggleLike($event)"
          >
            <app-ui-icon [icon]="heartIcon" [size]="17" />{{ fmtNumero(deck().likes_count) }}
          </button>
        } @else if (!isOficial()) {
          <span class="deck-like"
            ><app-ui-icon [icon]="heartIcon" [size]="16" />{{ fmtNumero(deck().likes_count) }}</span
          >
        }
        @if (podeCurtir()) {
          <button type="button" class="deck-action" (click)="handleVerCurtidas($event)">
            ver curtidas
          </button>
        }
      </div>
      @if (mostrarAcoes()) {
        <div class="deck-manage">
          <button
            type="button"
            class="deck-action"
            [disabled]="ocupado()"
            (click)="handleEditar($event)"
          >
            Editar</button
          ><button
            type="button"
            class="deck-action deck-action--danger"
            [disabled]="ocupado()"
            (click)="handleExcluir($event)"
          >
            Excluir
          </button>
        </div>
      }
    </footer>
  }
</article>
