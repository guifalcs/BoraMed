<div class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm">
  <!-- Número + badge de não respondida -->
  <div class="mb-3 flex items-center gap-2">
    <span class="inline-flex items-center rounded bg-[var(--color-surface-2)] px-2 py-0.5 text-xs font-medium text-[var(--color-text-muted)]">
      Questão {{ numero() }}
    </span>
    @if (naoRespondida()) {
      <span class="inline-flex items-center rounded border border-[var(--color-border)] bg-[var(--color-surface-2)] px-2 py-0.5 text-xs font-medium text-[var(--color-text-muted)]">
        Não respondida
      </span>
    }
  </div>

  <!-- Imagem -->
  @if (questao().imagem_url) {
    <figure class="mb-4 flex flex-col items-center gap-1">
      @if (!imgCarregada()) {
        <div class="w-full max-w-lg h-48 animate-pulse rounded-lg bg-[var(--color-surface-2)]"></div>
      }
      <img
        [src]="questao().imagem_url!"
        [alt]="questao().imagem_legenda ?? 'Imagem da questão'"
        class="max-w-full max-h-[60vh] w-auto h-auto rounded-lg object-contain"
        [class.hidden]="!imgCarregada()"
        loading="lazy"
        decoding="async"
        (load)="onImgLoad()"
      />
      @if (questao().imagem_legenda && imgCarregada()) {
        <figcaption class="text-center text-xs text-gray-400">{{ questao().imagem_legenda }}</figcaption>
      }
    </figure>
  }

  <!-- Enunciado de apoio -->
  @if (questao().enunciado_apoio) {
    <div class="bg-slate-50 rounded-lg p-4 border-b border-gray-100 pb-4 mb-4 text-sm text-[var(--color-text)]">
      <markdown [data]="questao().enunciado_apoio!"></markdown>
    </div>
  }

  <!-- Enunciado -->
  <div class="mb-4 text-base font-medium text-[var(--color-text)] leading-relaxed">
    <markdown [data]="questao().enunciado"></markdown>
  </div>

  <!-- Alternativas -->
  <ul class="flex flex-col gap-2" role="radiogroup" [attr.aria-label]="'Alternativas da questão ' + numero()">
    @for (alt of questao().alternativas; track alt.id) {
      <li>
        <app-alternativa-item
          [alternativa]="alt"
          [estado]="estadoAlternativa(alt.id)"
          (selecionar)="responder.emit($event)"
        />
      </li>
    }
  </ul>

  <!-- Explicação (modo Estudo após responder) -->
  @if (exibirExplicacao()) {
    <app-questao-explicacao
      [explicacao]="questao().explicacao"
      [referencia]="questao().referencia"
    />
  }
</div>
