<div class="relative overflow-hidden rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] px-6 py-7 shadow-sm md:px-8">
  <!-- Accent strip no topo -->
  <div class="absolute inset-x-0 top-0 h-[3px] rounded-t-2xl bg-gradient-to-r from-[var(--color-primary)] via-[var(--color-primary-light)] to-indigo-400"></div>

  <!-- Decoração suave -->
  <div class="pointer-events-none absolute -right-8 -top-8 h-32 w-32 rounded-full bg-blue-50 opacity-60 blur-2xl"></div>

  <div class="relative flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
    <!-- Saudação -->
    <div>
      <p class="text-sm font-medium text-[var(--color-text-muted)]">{{ saudacao() }},</p>
      <h1 class="mt-1 text-3xl font-extrabold tracking-tight text-[var(--color-text)]">
        {{ primeiroNome() }}
      </h1>
      @if (contexto()) {
        <p class="mt-2 flex items-center gap-1.5 text-sm text-[var(--color-text-muted)]">
          <span class="inline-block h-1.5 w-1.5 rounded-full bg-[var(--color-primary)]"></span>
          {{ contexto() }}
        </p>
      }
    </div>

    <!-- CTA -->
    <div class="shrink-0">
      <a [routerLink]="rotaCta()">
        <app-ui-button
          [label]="labelCta()"
          [fullWidth]="false"
          [showArrow]="true"
        />
      </a>
    </div>
  </div>
</div>
