@if (temDados()) {
  <div class="h-[240px]">
    <canvas
      baseChart
      type="line"
      [data]="chartData()"
      [options]="chartOptions"
    ></canvas>
  </div>
} @else {
  <p class="py-6 text-center text-sm text-[var(--color-text-muted)]">Finalize simulados para ver sua evolução.</p>
}
