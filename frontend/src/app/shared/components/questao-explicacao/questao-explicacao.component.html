@if (explicacao()) {
  <div class="mt-4 overflow-hidden rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)]">
    <h4 class="border-b border-[var(--color-border)] bg-[var(--color-surface-2)] px-4 py-3 text-sm font-semibold text-[var(--color-text)]">
      Explicação
    </h4>

    @if (estruturada(); as e) {
      @if (e.intro) {
        <div class="border-b border-[var(--color-border)] px-4 py-3 text-sm leading-relaxed text-[var(--color-text)]">
          <markdown [data]="e.intro | formatarExplicacao"></markdown>
        </div>
      }

      @for (alt of e.alternativas; track alt.letra) {
        <div
          class="flex gap-3 border-b border-[var(--color-border)] px-4 py-3.5 last:border-b-0"
          [class]="linhaClasses(statusDaAlt(alt))"
        >
          <span
            class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold"
            [class]="chipClasses(statusDaAlt(alt))"
          >
            {{ alt.letra }}
          </span>
          <p class="min-w-0 flex-1 text-sm leading-relaxed">{{ alt.texto }}</p>
        </div>
      }
    } @else {
      <!-- Explicação em prosa (sem alternativas): o bloco inteiro fica verde,
           como a alternativa correta no formato estruturado. -->
      <div class="px-4 py-3 text-sm leading-relaxed" [class]="linhaClasses('correta')">
        <markdown [data]="explicacao()! | formatarExplicacao"></markdown>
      </div>
    }

    @if (referencia()) {
      <div class="border-t border-[var(--color-border)] px-4 py-2">
        <span class="text-xs font-semibold text-[var(--color-text-muted)]">Referência:</span>
        <span class="text-xs text-[var(--color-text-muted)]"> {{ referencia() }}</span>
      </div>
    }
  </div>
}
