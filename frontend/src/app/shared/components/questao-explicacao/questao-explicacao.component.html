@if (explicacao()) {
  <div class="mt-4 rounded-lg border border-emerald-200 bg-emerald-50 p-4">
    <h4 class="mb-2 text-sm font-semibold text-emerald-800">Explicação</h4>
    <div class="text-sm text-emerald-900 leading-relaxed">
      <markdown [data]="explicacao()!"></markdown>
    </div>
    @if (referencia()) {
      <div class="mt-3 border-t border-emerald-200 pt-2">
        <span class="text-xs font-semibold text-gray-500">Referência:</span>
        <span class="text-xs text-gray-400"> {{ referencia() }}</span>
      </div>
    }
  </div>
}
