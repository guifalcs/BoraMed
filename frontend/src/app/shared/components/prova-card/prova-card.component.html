<button
  type="button"
  class="w-full rounded-xl border bg-[var(--color-surface)] p-5 text-left shadow-sm transition-all hover:shadow-md hover:border-[var(--color-primary-light)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]"
  [class.border-[var(--color-primary)]]="destacar()"
  [class.border-[var(--color-border)]]="!destacar()"
  (click)="abrirProva.emit(prova().id)"
>
  <div class="flex items-start justify-between gap-3">
    <div class="flex flex-col gap-1">
      <span class="text-base font-semibold text-[var(--color-text)]">{{ prova().nome }}</span>
      <span class="text-xs text-[var(--color-text-muted)]">
        {{ prova().ano }} · {{ prova().semestre }}º semestre · {{ prova().periodo }}º período
      </span>
    </div>
    @if (subtipoLabel()) {
      <span class="shrink-0 rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-700">
        {{ subtipoLabel() }}
      </span>
    }
  </div>
  <div class="mt-3 flex items-center gap-4 text-xs text-[var(--color-text-muted)]">
    <span>{{ prova().qtd_questoes }} questões</span>
    @if (prova().tempo_sugerido_minutos) {
      <span>{{ prova().tempo_sugerido_minutos }} min</span>
    }
  </div>
</button>
