<header class="sticky top-0 z-10 border-b border-[var(--color-border)] bg-[var(--color-surface)] px-4 py-3">
  <div class="mx-auto flex max-w-3xl items-center gap-3">

    <!-- Sair -->
    <button
      type="button"
      class="shrink-0 flex items-center gap-1 rounded-md px-2 py-1.5 text-xs font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] hover:text-[var(--color-primary)] transition-colors"
      (click)="sair.emit()"
      aria-label="Sair da prova"
    >
      <app-ui-icon [icon]="arrowLeftIcon" [size]="14" />
      <span class="hidden sm:inline">Sair</span>
    </button>

    <div class="w-px h-5 shrink-0 bg-[var(--color-border)]"></div>

    <!-- Título + progresso -->
    <div class="flex flex-col gap-1 flex-1 min-w-0">
      <span class="truncate text-sm font-semibold text-[var(--color-text)]">{{ titulo() }}</span>
      <div class="flex items-center gap-2">
        <div class="h-1.5 w-24 overflow-hidden rounded-full bg-[var(--color-surface-2)]">
          <div
            class="h-full rounded-full bg-[var(--color-primary)] transition-all"
            [style.width.%]="progressoPercent()"
          ></div>
        </div>
        <span class="text-xs text-[var(--color-text-muted)]">
          {{ totalRespondidas() }} / {{ totalQuestoes() }}
        </span>
      </div>
    </div>

    <!-- Timer + Ações -->
    <div class="flex shrink-0 items-center gap-3">
      @if (exibirTimer()) {
        <app-timer [seconds]="segundos()" />
      }
      @if (exibirPausar()) {
        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] px-2 py-1.5 text-xs font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] transition-colors sm:px-3"
          [attr.aria-label]="isPaused() ? 'Retomar' : 'Pausar'"
          (click)="togglePausar.emit()"
        >
          @if (isPaused()) {
            <app-ui-icon [icon]="playIcon" [size]="14" />
            <span class="hidden sm:inline">Retomar</span>
          } @else {
            <app-ui-icon [icon]="pauseIcon" [size]="14" />
            <span class="hidden sm:inline">Pausar</span>
          }
        </button>
      }
      @if (modo() !== 'visualizar') {
        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg bg-[var(--color-primary)] px-2 py-1.5 text-xs font-medium text-white hover:opacity-90 transition-opacity disabled:opacity-60 sm:px-3"
          [disabled]="salvando()"
          aria-label="Finalizar prova"
          (click)="finalizar.emit()"
        >
          @if (salvando()) {
            <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
          } @else {
            <app-ui-icon [icon]="flagIcon" [size]="14" />
          }
          <span class="hidden sm:inline">{{ salvando() ? 'Salvando...' : 'Finalizar' }}</span>
        </button>
      }
    </div>

  </div>
</header>
