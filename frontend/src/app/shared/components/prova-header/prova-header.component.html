<header class="sticky top-0 z-10 border-b border-[var(--color-border)] bg-[var(--color-surface)] px-4 py-3">
  <div class="mx-auto flex max-w-3xl items-center justify-between gap-4">
    <!-- Progresso -->
    <div class="flex flex-col gap-1 min-w-0">
      <span class="truncate text-sm font-semibold text-[var(--color-text)]">{{ titulo() }}</span>
      <div class="flex items-center gap-2">
        <div class="h-1.5 w-24 overflow-hidden rounded-full bg-[var(--color-surface-2)]">
          <div
            class="h-full rounded-full bg-[var(--color-primary)] transition-all"
            [style.width.%]="progressoPercent()"
          ></div>
        </div>
        <span class="text-xs text-[var(--color-text-muted)]">
          {{ totalRespondidas() }} / {{ totalQuestoes() }}
        </span>
      </div>
    </div>

    <!-- Timer + Ações -->
    <div class="flex shrink-0 items-center gap-3">
      @if (exibirTimer()) {
        <app-timer [seconds]="segundos()" />
      }
      @if (exibirPausar()) {
        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-1.5 text-xs font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] transition-colors"
          (click)="pausar.emit()"
        >
          <app-ui-icon [icon]="pauseIcon" [size]="14" />
          Pausar
        </button>
      }
      <app-ui-button
        label="Finalizar"
        [loading]="salvando()"
        loadingLabel="Salvando..."
        variant="primary"
        [fullWidth]="false"
        (buttonClick)="finalizar.emit()"
      />
    </div>
  </div>
</header>
