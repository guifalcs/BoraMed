<!-- Material translúcido: a questão passa por baixo da barra, como nas barras do iOS.
     90% e não menos: onde o blur não é aplicado, o texto por baixo não pode brigar com o cronômetro. -->
<header class="sticky top-[var(--bm-topbar,0px)] z-10 border-b border-[var(--color-border)] bg-white/90 px-4 py-3 backdrop-blur-xl backdrop-saturate-150">
  <div class="mx-auto flex max-w-3xl items-center gap-2 sm:gap-3">

    <!-- Sair -->
    @if (!focoAtivo()) {
      <button
        type="button"
        class="shrink-0 flex items-center gap-1 rounded-md px-2 py-1.5 text-xs font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] hover:text-[var(--color-primary)] bm-press"
        (click)="sair.emit()"
        aria-label="Sair da prova"
      >
        <app-ui-icon [icon]="arrowLeftIcon" [size]="14" />
        <span class="hidden sm:inline">Sair</span>
      </button>

      <div class="w-px h-5 shrink-0 bg-[var(--color-border)]"></div>
    }

    <!-- Título + progresso -->
    <div class="flex flex-col gap-1 flex-1 min-w-0">
      <span class="truncate text-sm font-semibold text-[var(--color-text)]">{{ titulo() }}</span>
      <div class="flex items-center gap-2">
        <div class="h-1.5 w-16 overflow-hidden sm:w-24 rounded-full bg-[var(--color-surface-2)]" role="progressbar" [attr.aria-valuenow]="totalRespondidas()" [attr.aria-valuemin]="0" [attr.aria-valuemax]="totalQuestoes()" [attr.aria-label]="'Progresso: ' + totalRespondidas() + ' de ' + totalQuestoes() + ' questões respondidas'">
          <div
            class="h-full rounded-full bg-[var(--color-primary)] transition-[width] duration-300 ease-out"
            [style.width.%]="progressoPercent()"
          ></div>
        </div>
        <span class="whitespace-nowrap text-xs tabular-nums text-[var(--color-text-muted)]">
          {{ totalRespondidas() }} / {{ totalQuestoes() }}
        </span>
      </div>
    </div>

    <!-- Timer + Ações -->
    <div class="flex shrink-0 items-center gap-2 sm:gap-3">
      @if (exibirTimer()) {
        <app-timer [seconds]="segundos()" />
      }
      @if (exibirPausar()) {
        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] px-2 py-1.5 text-xs font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] bm-press sm:px-3"
          [attr.aria-label]="isPaused() ? 'Retomar' : 'Pausar'"
          (click)="togglePausar.emit()"
        >
          @if (isPaused()) {
            <app-ui-icon [icon]="playIcon" [size]="14" />
            <span class="hidden sm:inline">Retomar</span>
          } @else {
            <app-ui-icon [icon]="pauseIcon" [size]="14" />
            <span class="hidden sm:inline">Pausar</span>
          }
        </button>
      }
      @if (modo() !== 'visualizar') {
        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg bg-[var(--color-primary)] px-2 py-1.5 text-xs font-medium text-white hover:opacity-90 bm-press disabled:opacity-60 sm:px-3"
          [disabled]="salvando()"
          aria-label="Finalizar prova"
          (click)="finalizar.emit()"
        >
          @if (salvando()) {
            <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
          } @else {
            <app-ui-icon [icon]="flagIcon" [size]="14" />
          }
          <span class="hidden sm:inline">{{ salvando() ? 'Salvando...' : 'Finalizar' }}</span>
          @if (!salvando() && naoRespondidas() > 0) {
            <span class="flex h-5 min-w-5 items-center justify-center rounded-full bg-white/25 px-1 text-[10px] font-bold leading-none">
              {{ naoRespondidas() }}
            </span>
          }
        </button>
      }

      <!-- Modo foco -->
      <button
        type="button"
        class="flex items-center justify-center rounded-lg border border-[var(--color-border)] p-1.5 text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] hover:text-[var(--color-text)] bm-press"
        [attr.aria-label]="focoAtivo() ? 'Sair do modo foco' : 'Ativar modo foco'"
        [title]="focoAtivo() ? 'Sair do modo foco' : 'Modo foco'"
        (click)="toggleFoco.emit()"
      >
        <app-ui-icon [icon]="focoAtivo() ? shrinkIcon : expandIcon" [size]="14" />
      </button>
    </div>

  </div>
</header>
