@if (url(); as src) {
  <div class="image-viewer" (click)="fechar($event)">
    <img [src]="src" alt="" class="image-viewer__img" (click)="$event.stopPropagation()" />
    <button type="button" class="image-viewer__fechar" aria-label="Fechar" (click)="fechar($event)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
}
