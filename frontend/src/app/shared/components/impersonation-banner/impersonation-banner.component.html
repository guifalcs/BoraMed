<div class="banner">
  <div class="banner-content">
    <span class="banner-icon">⚠️</span>
    <span class="banner-text">
      Sessão admin — você está acessando como
      <strong>{{ nomeUsuario() }}</strong>.
      Todas as ações são executadas como esse usuário.
    </span>
  </div>
  <button
    class="banner-btn"
    type="button"
    [disabled]="carregando()"
    (click)="onVoltar()"
  >
    {{ carregando() ? 'Voltando…' : 'Voltar para minha conta' }}
  </button>
</div>

<style>
  .banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: #fef3c7;
    border-bottom: 2px solid #f59e0b;
    flex-wrap: wrap;
  }
  .banner-content {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex: 1;
    min-width: 0;
  }
  .banner-icon { font-size: 1rem; flex-shrink: 0; }
  .banner-text {
    font-size: 0.875rem;
    color: #92400e;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .banner-text strong { font-weight: 700; }
  .banner-btn {
    padding: 0.375rem 0.875rem;
    background: #f59e0b;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .banner-btn:hover:not(:disabled) { background: #d97706; }
  .banner-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  @media (max-width: 640px) {
    .banner { flex-direction: column; align-items: flex-start; }
    .banner-text { white-space: normal; }
  }
