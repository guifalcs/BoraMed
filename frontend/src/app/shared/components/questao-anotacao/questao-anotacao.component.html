<section
  class="rounded-xl border border-blue-100 bg-blue-50/60 px-4 py-3 text-sm"
  [attr.aria-label]="'Anotação da questão ' + questaoNumero()"
>
  <div class="flex items-center justify-between gap-3">
    <button
      type="button"
      class="flex min-w-0 items-center gap-2 text-left font-semibold text-blue-800 transition-colors hover:text-blue-900"
      (click)="toggleAberto()"
      [attr.aria-expanded]="aberto()"
    >
      <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-white text-blue-700 shadow-sm">
        <app-ui-icon [icon]="stickyNoteIcon" [size]="16" />
      </span>
      <span class="min-w-0">
        <span class="block">{{ temConteudo() ? 'Anotação salva' : 'Adicionar anotação' }}</span>
        @if (temConteudo() && !aberto()) {
          <span class="block truncate text-xs font-normal text-blue-700">{{ preview() }}</span>
        }
      </span>
    </button>

    <div class="flex shrink-0 items-center gap-2">
      @if (salvando()) {
        <span class="text-xs font-medium text-blue-700">Salvando...</span>
      } @else if (erro()) {
        <span class="hidden text-xs font-medium text-red-700 sm:inline">{{ erro() }}</span>
      } @else if (temConteudo()) {
        <span class="hidden text-xs font-medium text-blue-700 sm:inline">Salvo</span>
      }

      @if (temConteudo()) {
        <button
          type="button"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-blue-700 transition-colors hover:bg-white hover:text-red-700"
          aria-label="Excluir anotação"
          (click)="onExcluir()"
        >
          <app-ui-icon [icon]="trashIcon" [size]="15" />
        </button>
      }
    </div>
  </div>

  @if (aberto()) {
    <div class="mt-3">
      <textarea
        class="min-h-32 w-full resize-y rounded-lg border border-blue-100 bg-white px-3 py-2 text-sm leading-6 text-[var(--color-text)] outline-none transition focus:border-[var(--color-primary-light)] focus:ring-4 focus:ring-blue-100"
        maxlength="5000"
        [value]="texto()"
        [attr.aria-label]="'Escrever anotação da questão ' + questaoNumero()"
        placeholder="Escreva o ponto que quer revisar depois..."
        (input)="onInput($event)"
      ></textarea>
      <div class="mt-1 flex items-center justify-between gap-3 text-xs">
        <span class="text-[var(--color-text-muted)]">Salvamento automático</span>
        <span
          [class.text-red-700]="contador() > 4800"
          [class.text-[var(--color-text-muted)]]="contador() <= 4800"
        >
          {{ contador() }}/5000
        </span>
      </div>
      @if (erro()) {
        <p class="mt-1 text-xs font-medium text-red-700">{{ erro() }}</p>
      }
    </div>
  }
</section>
