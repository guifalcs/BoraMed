<div class="relative flex h-full min-h-[120px] flex-col justify-between overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] px-4 pb-4 pt-4 shadow-sm transition-shadow hover:shadow-md">
  <!-- Acento colorido no topo -->
  <div class="animate-shimmer-bar absolute inset-x-0 top-0 h-[3px]" [class]="acentoClass()"></div>

  <div class="mt-2 flex items-center justify-between gap-2">
    <span class="text-xs font-medium leading-tight text-[var(--color-text-muted)]">{{ label() }}</span>
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"
      [class]="iconeBgClass()"
    >
      <app-ui-icon [icon]="icone()" [size]="16" />
    </div>
  </div>

  <div>
    <p
      class="truncate text-2xl font-extrabold leading-none tracking-tight md:text-3xl"
      [class]="valorClass()"
    >
      {{ valor() }}
    </p>
    <div class="mt-1.5 flex items-center gap-2">
      @if (sparklinePath(); as sp) {
        <svg [attr.width]="sp.w" [attr.height]="sp.h" class="shrink-0">
          <polyline
            [attr.points]="sp.polyline"
            fill="none"
            [attr.stroke]="sparklineColor()"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
      <p
        class="hidden truncate text-xs text-[var(--color-text-muted)] sm:block"
        [class.invisible]="!sublabel()"
        [title]="sublabel() ?? ''"
      >{{ sublabel() ?? '-' }}</p>
    </div>
  </div>
</div>
