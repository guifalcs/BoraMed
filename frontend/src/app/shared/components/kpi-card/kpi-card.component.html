<div class="relative flex flex-col gap-4 overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-sm transition-shadow hover:shadow-md">
  <!-- Acento colorido na base -->
  <div class="absolute inset-x-0 bottom-0 h-[3px]" [class]="acentoClass()"></div>

  <div class="flex items-center justify-between gap-2">
    <span class="text-xs font-medium leading-tight text-[var(--color-text-muted)]">{{ label() }}</span>
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"
      [class]="iconeBgClass()"
    >
      <app-ui-icon [icon]="icone()" [size]="16" />
    </div>
  </div>

  <div>
    <p
      class="truncate text-2xl font-extrabold leading-none tracking-tight md:text-3xl"
      [class]="valorClass()"
    >
      {{ valor() }}
    </p>
    @if (sublabel()) {
      <p class="mt-1.5 truncate text-xs text-[var(--color-text-muted)]" [title]="sublabel()!">{{ sublabel() }}</p>
    }
  </div>
</div>
