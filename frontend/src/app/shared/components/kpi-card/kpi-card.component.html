<div class="flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-sm">
  <div class="flex items-start justify-between gap-2">
    <span class="text-xs font-medium leading-tight text-[var(--color-text-muted)]">{{ label() }}</span>
    <div
      class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg"
      [class]="iconeBgClass()"
    >
      <app-ui-icon [icon]="icone()" [size]="14" />
    </div>
  </div>
  <div>
    <p
      class="truncate text-2xl font-extrabold leading-none tracking-tight"
      [class]="valorClass()"
    >
      {{ valor() }}
    </p>
    @if (sublabel()) {
      <p class="mt-1.5 text-xs text-[var(--color-text-muted)]">{{ sublabel() }}</p>
    }
  </div>
</div>
