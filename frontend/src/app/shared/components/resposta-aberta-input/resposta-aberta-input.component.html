<div class="flex flex-col gap-2">
  @if (estado() === 'enviada') {
    <div class="rounded-lg border border-[var(--color-border)] bg-[var(--color-surface-2)] p-4">
      <div class="mb-2 flex items-center gap-2">
        <span class="inline-flex items-center rounded bg-emerald-100 px-2 py-0.5 text-xs font-medium text-emerald-800">
          Resposta enviada
        </span>
      </div>
      <p class="whitespace-pre-wrap text-sm leading-relaxed text-[var(--color-text)]">{{ textoAtual() }}</p>
    </div>
  } @else {
    <textarea
      class="min-h-36 w-full resize-y rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] p-3 text-sm leading-relaxed text-[var(--color-text)] focus:border-[var(--color-primary)] focus:outline-none disabled:opacity-60"
      rows="6"
      placeholder="Escreva sua resposta…"
      [attr.maxlength]="maxChars"
      [value]="textoAtual()"
      [disabled]="estado() === 'enviando' || desabilitado()"
      (input)="onInput($any($event.target).value)"
      aria-label="Resposta discursiva"
    ></textarea>

    <div class="flex items-center justify-between gap-3">
      <span class="text-xs text-[var(--color-text-muted)]">{{ chars() }}/{{ maxChars }}</span>

      @if (confirmando()) {
        <div class="flex items-center gap-2">
          <span class="text-xs text-[var(--color-text-muted)]">Enviar definitivamente? Não será possível editar.</span>
          <button
            type="button"
            class="rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-xs font-medium text-[var(--color-text)] hover:bg-[var(--color-surface-2)]"
            (click)="cancelarEnvio()"
          >
            Cancelar
          </button>
          <button
            type="button"
            class="rounded-lg bg-[var(--color-primary)] px-3 py-1.5 text-xs font-semibold text-white hover:opacity-90"
            (click)="confirmarEnvio()"
          >
            Confirmar envio
          </button>
        </div>
      } @else {
        <button
          type="button"
          class="rounded-lg bg-[var(--color-primary)] px-4 py-2 text-sm font-semibold text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="!podeEnviar()"
          (click)="pedirConfirmacao()"
        >
          @if (estado() === 'enviando') {
            Enviando…
          } @else {
            Enviar resposta
          }
        </button>
      }
    </div>
  }
</div>
