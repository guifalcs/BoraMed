<div class="px-4 py-8 md:px-8">
  <div class="mx-auto max-w-2xl">
    <!-- Breadcrumb -->
    <a routerLink="/dashboard/provas" class="mb-6 flex items-center gap-1 text-sm text-[var(--color-text-muted)] hover:text-[var(--color-primary)]">
      <app-ui-icon [icon]="chevronLeftIcon" [size]="16" />
      Provas
    </a>

    <h1 class="mb-1 text-2xl font-extrabold text-[var(--color-text)]">Rede Afya</h1>
    <p class="mb-8 text-sm text-[var(--color-text-muted)]">Escolha o tipo de prova.</p>

    <div class="grid gap-4 sm:grid-cols-3">
      <!-- Nacional — ATIVO -->
      <a
        routerLink="/dashboard/provas/afya/nacional"
        class="group flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5 shadow-sm transition-all hover:shadow-md hover:border-[var(--color-primary-light)]"
      >
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-[var(--color-primary)]">
          <app-ui-icon [icon]="awardIcon" [size]="20" />
        </div>
        <div>
          <h2 class="text-sm font-semibold text-[var(--color-text)] group-hover:text-[var(--color-primary)]">Nacional</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">N1, Teste de Progresso, N2</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-blue-100 px-2 py-0.5 text-xs font-semibold text-blue-700">Disponível</span>
      </a>

      <!-- Processual — placeholder -->
      <a
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ tipo: 'processual' }"
        class="flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5 shadow-sm opacity-60"
      >
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
          <app-ui-icon [icon]="stethoscopeIcon" [size]="20" />
        </div>
        <div>
          <h2 class="text-sm font-semibold text-[var(--color-text)]">Processual</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">N1, N2 processuais</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-gray-100 px-2 py-0.5 text-xs font-semibold text-gray-500">Em breve</span>
      </a>

      <!-- Multiestações — placeholder -->
      <a
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ tipo: 'multiestacoes' }"
        class="flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5 shadow-sm opacity-60"
      >
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
          <app-ui-icon [icon]="flaskIcon" [size]="20" />
        </div>
        <div>
          <h2 class="text-sm font-semibold text-[var(--color-text)]">Multiestações</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">Lab com imagens</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-gray-100 px-2 py-0.5 text-xs font-semibold text-gray-500">Em breve</span>
      </a>
    </div>
  </div>
</div>
