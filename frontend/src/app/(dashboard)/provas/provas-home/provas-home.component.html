<div class="px-4 py-8 md:px-8">
  <div class="mx-auto max-w-2xl">
    <h1 class="mb-1 text-2xl font-extrabold text-[var(--color-text)]">Provas</h1>
    <p class="mb-8 text-sm text-[var(--color-text-muted)]">Selecione a origem das provas para começar.</p>

    <div class="grid gap-4 sm:grid-cols-2">
      <!-- Rede Afya — ATIVO -->
      <a
        routerLink="/dashboard/provas/afya"
        class="group flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm transition-all hover:shadow-md hover:border-[var(--color-primary-light)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-primary)]"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-[var(--color-primary)]">
          <app-ui-icon [icon]="bookOpenIcon" [size]="24" />
        </div>
        <div>
          <h2 class="font-semibold text-[var(--color-text)] group-hover:text-[var(--color-primary)]">Rede Afya</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">Provas nacionais e processuais da rede</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-700">
          Disponível
        </span>
      </a>

      <!-- Outras faculdades — placeholder -->
      <a
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ tipo: 'outras' }"
        class="flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm opacity-70 cursor-not-allowed"
        (click)="$event.preventDefault()"
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ tipo: 'outras' }"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
          <app-ui-icon [icon]="buildingIcon" [size]="24" />
        </div>
        <div>
          <h2 class="font-semibold text-[var(--color-text)]">Outras faculdades</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">ENADE, residências e outras instituições</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-semibold text-gray-500">
          Em breve
        </span>
      </a>
    </div>
  </div>
</div>
