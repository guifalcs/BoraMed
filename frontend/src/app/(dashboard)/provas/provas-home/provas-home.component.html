<div class="px-4 py-8 md:px-8 lg:px-12 xl:px-16">
  <div class="mx-auto max-w-5xl">
    <h1 class="mb-1 text-2xl font-extrabold text-[var(--color-text)]">Provas</h1>
    <p class="mb-8 text-sm text-[var(--color-text-muted)]">Selecione a origem das provas para começar.</p>

    <div class="grid gap-4 sm:grid-cols-2 lg:gap-6">

      <!-- Rede Afya — destaque com gradiente -->
      <a
        routerLink="/dashboard/provas/afya"
        class="group relative overflow-hidden rounded-2xl p-6 shadow-lg transition-all hover:shadow-xl hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2"
        style="background: radial-gradient(circle at 82% 22%, rgba(255,255,255,0.18), transparent 26%), radial-gradient(circle at 20% 85%, rgba(13,148,136,0.22), transparent 28%), linear-gradient(145deg, #1E40AF 0%, #2451D8 48%, #6427D9 100%);"
      >
        <!-- Círculo decorativo de fundo -->
        <div class="pointer-events-none absolute -right-8 -top-8 h-40 w-40 rounded-full bg-white opacity-5"></div>
        <div class="pointer-events-none absolute -bottom-6 -left-6 h-28 w-28 rounded-full bg-white opacity-5"></div>

        <div class="relative flex flex-col gap-4">
          <!-- Ícone -->
          <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-white/20 text-white backdrop-blur-sm">
            <app-ui-icon [icon]="bookOpenIcon" [size]="24" />
          </div>

          <!-- Texto -->
          <div>
            <h2 class="text-lg font-bold text-white">Rede Afya</h2>
            <p class="mt-1 text-sm text-white/75">Provas nacionais, processuais e multiestações de todos os campi</p>
          </div>

          <!-- Badge + seta -->
          <div class="flex items-center justify-between">
            <span class="rounded-full bg-white/20 px-3 py-1 text-xs font-semibold text-white backdrop-blur-sm">
              Disponível agora
            </span>
            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-white/20 text-white transition-transform group-hover:translate-x-1">
              →
            </span>
          </div>
        </div>
      </a>

      <!-- Outras faculdades — placeholder secundário -->
      <a
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ tipo: 'outras' }"
        class="flex flex-col gap-3 rounded-2xl border border-dashed border-[var(--color-border)] bg-[var(--color-surface)] p-6 opacity-60 cursor-not-allowed"
        (click)="$event.preventDefault()"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
          <app-ui-icon [icon]="buildingIcon" [size]="24" />
        </div>
        <div>
          <h2 class="text-lg font-semibold text-[var(--color-text)]">Outras faculdades</h2>
          <p class="mt-1 text-sm text-[var(--color-text-muted)]">ENADE, residências e outras instituições</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-[var(--color-surface-2)] px-3 py-1 text-xs font-semibold text-[var(--color-text-muted)]">
          Em breve
        </span>
      </a>

    </div>
  </div>
</div>
