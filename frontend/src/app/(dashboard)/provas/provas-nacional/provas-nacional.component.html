<div class="px-4 py-8 md:px-8">
  <div class="mx-auto max-w-2xl">
    <a routerLink="/dashboard/provas/afya" class="mb-6 flex items-center gap-1 text-sm text-[var(--color-text-muted)] hover:text-[var(--color-primary)]">
      <app-ui-icon [icon]="chevronLeftIcon" [size]="16" />
      Rede Afya
    </a>

    <h1 class="mb-1 text-2xl font-extrabold text-[var(--color-text)]">Prova Nacional</h1>
    <p class="mb-8 text-sm text-[var(--color-text-muted)]">Como você quer estudar?</p>

    <div class="grid gap-4 sm:grid-cols-2">
      <!-- Provas antigas — ATIVO -->
      <a
        routerLink="/dashboard/provas/afya/nacional/lista"
        class="group flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm transition-all hover:shadow-md hover:border-[var(--color-primary-light)]"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-[var(--color-primary)]">
          <app-ui-icon [icon]="bookOpenIcon" [size]="24" />
        </div>
        <div>
          <h2 class="font-semibold text-[var(--color-text)] group-hover:text-[var(--color-primary)]">Provas antigas</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">Acesse provas anteriores completas e escolha como resolver</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-blue-100 px-2.5 py-0.5 text-xs font-semibold text-blue-700">Disponível</span>
      </a>

      <!-- Simulado por temas — placeholder -->
      <a
        routerLink="/dashboard/provas/afya/em-breve"
        [queryParams]="{ modo: 'simulado-temas' }"
        class="flex flex-col gap-3 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6 shadow-sm opacity-60"
      >
        <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[var(--color-surface-2)] text-[var(--color-text-muted)]">
          <app-ui-icon [icon]="zapIcon" [size]="24" />
        </div>
        <div>
          <h2 class="font-semibold text-[var(--color-text)]">Simulado por temas</h2>
          <p class="mt-0.5 text-xs text-[var(--color-text-muted)]">Monte um simulado personalizado com questões filtradas por tema</p>
        </div>
        <span class="inline-flex w-fit rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-semibold text-gray-500">Em breve</span>
      </a>
    </div>
  </div>
</div>
