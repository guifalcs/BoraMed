<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-top">
      <a routerLink="/dashboard" aria-label="Ir para início">
        <img
          src="brand/logo.webp"
          alt="BoraMed"
          class="sidebar-logo"
          width="400"
          height="128"
          decoding="async"
        />
      </a>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route === '/dashboard/simulados' ? provasRoute() : item.route"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
          [attr.data-onboarding-target]="item.onboardingTarget ?? null"
        >
          <app-ui-icon [icon]="item.icon" [size]="20" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-notif-row">
        <app-notificacoes-sino [sidebar]="true" />
        <span class="sidebar-notif-label">Notificações</span>
      </div>
      <div class="desktop-avatar-wrapper">
        <button class="user-card" type="button" aria-label="Menu do perfil" data-onboarding-target="profile-menu" (click)="toggleMenu()">
          <app-ui-avatar
            [name]="profile()?.nome_completo ?? user()?.email ?? 'Usuário'"
            [avatarUrl]="profile()?.avatar_url ?? null"
            size="sm"
          />
          <div class="user-info">
            <span class="user-name">{{ profile()?.nome_completo ?? user()?.email }}</span>
            <span class="user-role">{{ roleLabel() }}</span>
          </div>
        </button>

        @if (menuAberto()) {
          <div class="desktop-menu-backdrop" (click)="fecharMenu()"></div>
          <div class="desktop-menu" role="menu">
            <a class="desktop-menu-item" routerLink="/dashboard/perfil" (click)="fecharMenu()" role="menuitem">
              <app-ui-icon [icon]="userIcon" [size]="18" />
              <span>Perfil</span>
            </a>
            @if (isAdmin()) {
              <div class="desktop-menu-divider"></div>
              <a class="desktop-menu-item desktop-menu-item--admin" routerLink="/admin" (click)="fecharMenu()" role="menuitem">
                <app-ui-icon [icon]="settingsIcon" [size]="18" />
                <span>Painel Admin</span>
              </a>
            }
            <div class="desktop-menu-divider"></div>
            <button class="desktop-menu-item desktop-menu-item--danger" type="button" role="menuitem" (click)="handleSignOut()">
              <app-ui-icon [icon]="logOutIcon" [size]="18" />
              <span>Sair</span>
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <header class="mobile-header">
    <a routerLink="/dashboard" aria-label="Ir para início">
      <img
        src="brand/logo.webp"
        alt="BoraMed"
        class="mobile-logo"
        width="400"
        height="128"
        decoding="async"
      />
    </a>
    <div class="mobile-header-actions">
      <!-- sino renderizado fora do header via classe mobile-notif-float -->
    </div>
    <div class="mobile-avatar-wrapper">
      <button class="mobile-avatar-btn" type="button" aria-label="Menu do perfil" data-onboarding-target="profile-menu" (click)="toggleMenu()">
        <app-ui-avatar
          [name]="profile()?.nome_completo ?? user()?.email ?? 'Usuário'"
          [avatarUrl]="profile()?.avatar_url ?? null"
          size="sm"
        />
      </button>

      @if (menuAberto()) {
        <div class="mobile-menu-backdrop" (click)="fecharMenu()"></div>
        <div class="mobile-menu" role="menu">
          <a class="mobile-menu-item" routerLink="/dashboard/perfil" (click)="fecharMenu()" role="menuitem">
            <app-ui-icon [icon]="userIcon" [size]="18" />
            <span>Perfil</span>
          </a>
          @if (isAdmin()) {
            <a class="mobile-menu-item mobile-menu-item--admin" routerLink="/admin" (click)="fecharMenu()" role="menuitem">
              <app-ui-icon [icon]="settingsIcon" [size]="18" />
              <span>Painel Admin</span>
            </a>
          }
          <button class="mobile-menu-item mobile-menu-item--danger" type="button" role="menuitem" (click)="handleSignOut()">
            <app-ui-icon [icon]="logOutIcon" [size]="18" />
            <span>Sair</span>
          </button>
        </div>
      }
    </div>
  </header>

  <!-- Sino fora do mobile-header para escapar do stacking context (position:fixed) -->
  <div class="mobile-notif-float">
    <app-notificacoes-sino />
  </div>

  <main class="main-content">
    @if (impersonando(); as info) {
      <app-impersonation-banner
        [nomeUsuario]="info.targetName"
        (voltar)="handleVoltarParaAdmin()"
      />
    }
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    @for (item of navItems; track item.route) {
      <a
        class="bottom-nav-item"
        [routerLink]="item.route === '/dashboard/simulados' ? provasRoute() : item.route"
        routerLinkActive="bottom-nav-item--active"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        [attr.data-onboarding-target]="item.onboardingTarget ?? null"
      >
        <app-ui-icon [icon]="item.icon" [size]="22" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <app-onboarding-tour
    [flow]="onboarding.flow"
    [activeStep]="onboarding.activeStep()"
    [progressLabel]="onboarding.progressLabel()"
    [canGoBack]="onboarding.canGoBack()"
    [isVisible]="onboarding.isVisible()"
    (avancar)="handleOnboardingNext()"
    (voltar)="handleOnboardingBack()"
    (pular)="handleOnboardingSkip()"
    (finalizar)="handleOnboardingComplete()"
  />

  <app-aviso-modal />

  <app-suporte-widget />

</div>
