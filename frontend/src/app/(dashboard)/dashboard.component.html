<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-top">
      <a routerLink="/dashboard" aria-label="Ir para início">
        <img src="logo.png" alt="BoraMed" class="sidebar-logo" />
      </a>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route === '/dashboard/simulados' ? provasRoute() : item.route"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        >
          <app-ui-icon [icon]="item.icon" [size]="20" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-bottom">
      <div class="desktop-avatar-wrapper">
        <button class="user-card" type="button" aria-label="Menu do perfil" (click)="toggleMenu()">
          <app-ui-avatar
            [name]="profile()?.nome_completo ?? user()?.email ?? 'Usuário'"
            [avatarUrl]="profile()?.avatar_url ?? null"
            size="sm"
          />
          <div class="user-info">
            <span class="user-name">{{ profile()?.nome_completo ?? user()?.email }}</span>
            <span class="user-role">{{ isAdmin() ? 'Admin' : 'Aluno' }}</span>
          </div>
        </button>

        @if (menuAberto()) {
          <div class="desktop-menu-backdrop" (click)="fecharMenu()"></div>
          <div class="desktop-menu" role="menu">
            <a class="desktop-menu-item" routerLink="/dashboard/perfil" (click)="fecharMenu()" role="menuitem">
              <app-ui-icon [icon]="userIcon" [size]="18" />
              <span>Perfil</span>
            </a>
            <a class="desktop-menu-item" routerLink="/dashboard/suporte" (click)="fecharMenu()" role="menuitem">
              <app-ui-icon [icon]="lifeBuoyIcon" [size]="18" />
              <span>Suporte</span>
            </a>
            @if (isAdmin()) {
              <div class="desktop-menu-divider"></div>
              <a class="desktop-menu-item desktop-menu-item--admin" routerLink="/admin" (click)="fecharMenu()" role="menuitem">
                <app-ui-icon [icon]="settingsIcon" [size]="18" />
                <span>Painel Admin</span>
              </a>
            }
            <div class="desktop-menu-divider"></div>
            <button class="desktop-menu-item desktop-menu-item--danger" type="button" role="menuitem" (click)="handleSignOut()">
              <app-ui-icon [icon]="logOutIcon" [size]="18" />
              <span>Sair</span>
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <header class="mobile-header">
    <a routerLink="/dashboard" aria-label="Ir para início">
      <img src="logotipo.png" alt="BoraMed" class="mobile-logo" />
    </a>
    <div class="mobile-avatar-wrapper">
      <button class="mobile-avatar-btn" type="button" aria-label="Menu do perfil" (click)="toggleMenu()">
        <app-ui-avatar
          [name]="profile()?.nome_completo ?? user()?.email ?? 'Usuário'"
          [avatarUrl]="profile()?.avatar_url ?? null"
          size="sm"
        />
      </button>

      @if (menuAberto()) {
        <div class="mobile-menu-backdrop" (click)="fecharMenu()"></div>
        <div class="mobile-menu" role="menu">
          <a class="mobile-menu-item" routerLink="/dashboard/perfil" (click)="fecharMenu()" role="menuitem">
            <app-ui-icon [icon]="userIcon" [size]="18" />
            <span>Perfil</span>
          </a>
          <a class="mobile-menu-item" routerLink="/dashboard/suporte" (click)="fecharMenu()" role="menuitem">
            <app-ui-icon [icon]="lifeBuoyIcon" [size]="18" />
            <span>Suporte</span>
          </a>
          @if (isAdmin()) {
            <a class="mobile-menu-item mobile-menu-item--admin" routerLink="/admin" (click)="fecharMenu()" role="menuitem">
              <app-ui-icon [icon]="settingsIcon" [size]="18" />
              <span>Painel Admin</span>
            </a>
          }
          <button class="mobile-menu-item mobile-menu-item--danger" type="button" role="menuitem" (click)="handleSignOut()">
            <app-ui-icon [icon]="logOutIcon" [size]="18" />
            <span>Sair</span>
          </button>
        </div>
      }
    </div>
  </header>

  <main class="main-content">
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    @for (item of navItems; track item.route) {
      <a
        class="bottom-nav-item"
        [routerLink]="item.route === '/dashboard/simulados' ? provasRoute() : item.route"
        routerLinkActive="bottom-nav-item--active"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
      >
        <app-ui-icon [icon]="item.icon" [size]="22" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

</div>
