<div class="px-4 py-6 md:px-8 lg:px-12 xl:px-16">
  <div class="mx-auto max-w-6xl">
    <app-page-header
      titulo="Materiais de Estudo"
      subtitulo="Acesse resumos, guias e materiais de apoio organizados por tema."
      [breadcrumbs]="breadcrumbs"
    />

    @if (isLoading()) {
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (i of [1, 2, 3]; track i) {
          <div class="h-40 animate-pulse rounded-2xl bg-[var(--color-surface-2)]"></div>
        }
      </div>
    } @else if (erro()) {
      <div class="flex flex-col items-center gap-3 py-16 text-center text-[var(--color-text-muted)]">
        <app-ui-icon [icon]="libraryIcon" [size]="40" />
        <p class="text-sm">{{ erro() }}</p>
      </div>
    } @else if (categorias().length === 0) {
      <div class="flex flex-col items-center gap-3 py-16 text-center text-[var(--color-text-muted)]">
        <app-ui-icon [icon]="libraryIcon" [size]="40" />
        <p class="text-sm">Nenhum material disponível ainda.</p>
      </div>
    } @else {
      <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-label="Categorias de materiais">
        @for (categoria of categorias(); track categoria.id) {
          <app-material-card
            [categoria]="categoria"
            (abrir)="abrirCategoria($event)"
          />
        }
      </section>
    }
  </div>
</div>
