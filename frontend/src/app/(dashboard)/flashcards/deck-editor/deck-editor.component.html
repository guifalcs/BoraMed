<div class="mx-auto max-w-3xl px-4 py-6 md:px-8 md:py-10">
  <app-page-header
    [titulo]="modoEdicao() ? 'Editar deck' : 'Novo deck'"
    subtitulo="Crie cards de pergunta e resposta para estudar depois."
    [breadcrumbs]="breadcrumbs"
  />

  @if (carregando()) {
    <p class="text-sm text-[var(--color-text-muted)]">Carregando…</p>
  } @else {
    <section class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5">
      <div class="flex flex-col gap-4">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-semibold text-[var(--color-text)]">Título</span>
          <input
            type="text"
            class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
            [value]="titulo()"
            (input)="titulo.set($any($event.target).value)"
            maxlength="120"
          />
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-sm font-semibold text-[var(--color-text)]">Descrição (opcional)</span>
          <textarea
            class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
            rows="2"
            [value]="descricao()"
            (input)="descricao.set($any($event.target).value)"
            maxlength="500"
          ></textarea>
        </label>

        <app-ui-checkbox
          [checked]="publico()"
          (checkedChange)="publico.set($event)"
          ariaLabel="Tornar público"
        >
          <span class="whitespace-nowrap text-sm text-[var(--color-text)]">
            Tornar este deck público
            <span class="text-xs text-[var(--color-text-muted)]">(aparece na Comunidade)</span>
          </span>
        </app-ui-checkbox>
      </div>
    </section>

    <section class="mt-6">
      <div class="mb-3 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            class="rounded-lg border border-[var(--color-border)] p-1.5 text-[var(--color-text)] transition-colors hover:bg-[var(--color-surface-2)] disabled:opacity-30"
            [disabled]="indiceCardAtivo() === 0"
            title="Card anterior"
            aria-label="Card anterior"
            (click)="irParaCard(indiceCardAtivo() - 1)"
          >
            <app-ui-icon [icon]="navAnteriorIcon" [size]="16" />
          </button>
          <span class="min-w-24 text-center text-sm font-semibold text-[var(--color-text)]">
            Card {{ indiceCardAtivo() + 1 }} de {{ cards().length }}
          </span>
          <button
            type="button"
            class="rounded-lg border border-[var(--color-border)] p-1.5 text-[var(--color-text)] transition-colors hover:bg-[var(--color-surface-2)] disabled:opacity-30"
            [disabled]="indiceCardAtivo() === cards().length - 1"
            title="Próximo card"
            aria-label="Próximo card"
            (click)="irParaCard(indiceCardAtivo() + 1)"
          >
            <app-ui-icon [icon]="navProximoIcon" [size]="16" />
          </button>
        </div>

        <div class="flex items-center gap-1">
          <button
            type="button"
            class="rounded p-1.5 text-[var(--color-text-muted)] transition-colors hover:bg-[var(--color-surface-2)] disabled:opacity-30"
            [disabled]="indiceCardAtivo() === 0"
            title="Trocar com o card anterior"
            aria-label="Trocar com o card anterior"
            (click)="moverCard(indiceCardAtivo(), -1)"
          >
            <app-ui-icon [icon]="moverTrasIcon" [size]="16" />
          </button>
          <button
            type="button"
            class="rounded p-1.5 text-[var(--color-text-muted)] transition-colors hover:bg-[var(--color-surface-2)] disabled:opacity-30"
            [disabled]="indiceCardAtivo() === cards().length - 1"
            title="Trocar com o próximo card"
            aria-label="Trocar com o próximo card"
            (click)="moverCard(indiceCardAtivo(), 1)"
          >
            <app-ui-icon [icon]="moverFrenteIcon" [size]="16" />
          </button>
          <button
            type="button"
            class="rounded p-1.5 text-red-600 transition-colors hover:bg-red-50"
            title="Remover card"
            aria-label="Remover card"
            (click)="removerCard(indiceCardAtivo())"
          >
            <app-ui-icon [icon]="trashIcon" [size]="16" />
          </button>
        </div>
      </div>

      @if (cardAtivo(); as card) {
        <article class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
          <div class="grid gap-4 md:grid-cols-2">
            <div class="flex flex-col gap-2">
              <span class="text-xs font-semibold text-[var(--color-text-muted)]">Frente</span>
              <textarea
                class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
                rows="4"
                [value]="card.frente"
                (input)="atualizarCard(indiceCardAtivo(), 'frente', $any($event.target).value)"
                maxlength="2000"
              ></textarea>
              <app-image-upload
                [currentUrl]="card.frenteImagemUrl"
                [bucket]="bucket"
                [pathPrefix]="pathPrefix"
                (urlChange)="atualizarCard(indiceCardAtivo(), 'frenteImagemUrl', $event)"
              />
            </div>

            <div class="flex flex-col gap-2">
              <span class="text-xs font-semibold text-[var(--color-text-muted)]">Verso</span>
              <textarea
                class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
                rows="4"
                [value]="card.verso"
                (input)="atualizarCard(indiceCardAtivo(), 'verso', $any($event.target).value)"
                maxlength="2000"
              ></textarea>
              <app-image-upload
                [currentUrl]="card.versoImagemUrl"
                [bucket]="bucket"
                [pathPrefix]="pathPrefix"
                (urlChange)="atualizarCard(indiceCardAtivo(), 'versoImagemUrl', $event)"
              />
            </div>
          </div>
        </article>
      }
    </section>

    @if (erro()) {
      <p class="mt-4 text-sm font-semibold text-red-600">{{ erro() }}</p>
    }

    <div class="mt-6 flex items-center justify-between gap-3">
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full text-white shadow-lg shadow-blue-600/30 transition-transform hover:scale-110 active:scale-95"
        style="background: var(--gradient-brand)"
        title="Adicionar card"
        aria-label="Adicionar card"
        (click)="adicionarCard()"
      >
        <app-ui-icon [icon]="plusIcon" [size]="20" />
      </button>

      <div class="flex items-center gap-3">
        <app-ui-button
          [label]="modoEdicao() ? 'Salvar alterações' : 'Criar deck'"
          [fullWidth]="false"
          [loading]="salvando()"
          (buttonClick)="salvar()"
        />
        <app-ui-button
          label="Cancelar"
          variant="secondary"
          [fullWidth]="false"
          [disabled]="salvando()"
          (buttonClick)="cancelar()"
        />
      </div>
    </div>
  }
</div>
