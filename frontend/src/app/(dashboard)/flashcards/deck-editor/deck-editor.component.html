<div class="mx-auto max-w-3xl px-4 py-6 md:px-8 md:py-10">
  <app-page-header
    [titulo]="modoEdicao() ? 'Editar deck' : 'Novo deck'"
    subtitulo="Crie cards de pergunta e resposta para estudar depois."
    [breadcrumbs]="breadcrumbs"
  />

  @if (carregando()) {
    <p class="text-sm text-[var(--color-text-muted)]">Carregando…</p>
  } @else {
    <section class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5">
      <div class="flex flex-col gap-4">
        <label class="flex flex-col gap-1">
          <span class="text-sm font-semibold text-[var(--color-text)]">Título</span>
          <input
            type="text"
            class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
            [value]="titulo()"
            (input)="titulo.set($any($event.target).value)"
            maxlength="120"
          />
        </label>

        <label class="flex flex-col gap-1">
          <span class="text-sm font-semibold text-[var(--color-text)]">Descrição (opcional)</span>
          <textarea
            class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
            rows="2"
            [value]="descricao()"
            (input)="descricao.set($any($event.target).value)"
            maxlength="500"
          ></textarea>
        </label>

        <app-ui-checkbox
          [checked]="publico()"
          (checkedChange)="publico.set($event)"
          ariaLabel="Tornar público"
        />
        <span class="-mt-3 text-xs text-[var(--color-text-muted)]">Tornar este deck público (aparece na Comunidade)</span>
      </div>
    </section>

    <section class="mt-6 flex flex-col gap-4">
      @for (card of cards(); track $index) {
        <article class="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
          <div class="mb-3 flex items-center justify-between">
            <span class="text-sm font-semibold text-[var(--color-text)]">Card {{ $index + 1 }}</span>
            <div class="flex items-center gap-1">
              <button
                type="button"
                class="rounded p-1 text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] disabled:opacity-30"
                [disabled]="$index === 0"
                aria-label="Mover card para cima"
                (click)="moverCard($index, -1)"
              >
                <app-ui-icon [icon]="upIcon" [size]="16" />
              </button>
              <button
                type="button"
                class="rounded p-1 text-[var(--color-text-muted)] hover:bg-[var(--color-surface-2)] disabled:opacity-30"
                [disabled]="$index === cards().length - 1"
                aria-label="Mover card para baixo"
                (click)="moverCard($index, 1)"
              >
                <app-ui-icon [icon]="downIcon" [size]="16" />
              </button>
              <button
                type="button"
                class="rounded p-1 text-red-600 hover:bg-red-50"
                aria-label="Remover card"
                (click)="removerCard($index)"
              >
                <app-ui-icon [icon]="trashIcon" [size]="16" />
              </button>
            </div>
          </div>

          <div class="grid gap-4 md:grid-cols-2">
            <div class="flex flex-col gap-2">
              <span class="text-xs font-semibold text-[var(--color-text-muted)]">Frente</span>
              <textarea
                class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
                rows="3"
                [value]="card.frente"
                (input)="atualizarCard($index, 'frente', $any($event.target).value)"
                maxlength="2000"
              ></textarea>
              <app-image-upload
                [currentUrl]="card.frenteImagemUrl"
                [bucket]="bucket"
                [pathPrefix]="pathPrefix"
                (urlChange)="atualizarCard($index, 'frenteImagemUrl', $event)"
              />
            </div>

            <div class="flex flex-col gap-2">
              <span class="text-xs font-semibold text-[var(--color-text-muted)]">Verso</span>
              <textarea
                class="rounded-lg border border-[var(--color-border)] px-3 py-2 text-sm"
                rows="3"
                [value]="card.verso"
                (input)="atualizarCard($index, 'verso', $any($event.target).value)"
                maxlength="2000"
              ></textarea>
              <app-image-upload
                [currentUrl]="card.versoImagemUrl"
                [bucket]="bucket"
                [pathPrefix]="pathPrefix"
                (urlChange)="atualizarCard($index, 'versoImagemUrl', $event)"
              />
            </div>
          </div>
        </article>
      }

      <app-ui-button
        label="Adicionar card"
        variant="secondary"
        [fullWidth]="false"
        (buttonClick)="adicionarCard()"
      />
    </section>

    @if (erro()) {
      <p class="mt-4 text-sm font-semibold text-red-600">{{ erro() }}</p>
    }

    <div class="mt-6 flex items-center gap-3">
      <app-ui-button
        [label]="modoEdicao() ? 'Salvar alterações' : 'Criar deck'"
        [fullWidth]="false"
        [loading]="salvando()"
        (buttonClick)="salvar()"
      />
      <app-ui-button
        label="Cancelar"
        variant="secondary"
        [fullWidth]="false"
        [disabled]="salvando()"
        (buttonClick)="cancelar()"
      />
    </div>
  }
</div>
