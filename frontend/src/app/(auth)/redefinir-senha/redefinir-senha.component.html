<main class="auth-page">
  <app-brand-panel
    kicker="Nova senha"
    titulo="Proteja seu histórico de <em>desempenho.</em>"
    descricao="Escolha uma senha forte para manter seus simulados e resultados seguros."
  />

  <section class="form-panel">
    <div class="auth-box">
      <h2 class="auth-heading">Redefinir senha.</h2>
      <p class="auth-copy">Crie uma nova senha para voltar ao BoraMed.</p>

      <form class="form" (submit)="handleSubmit($event)">
        <app-ui-input
          label="Nova senha"
          name="password"
          type="password"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [value]="password()"
          [error]="passwordError()"
          [showPasswordToggle]="true"
          [showStrength]="true"
          (valueChange)="password.set($event)"
        />

        <app-ui-input
          label="Confirmar nova senha"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="••••••••"
          [required]="true"
          [value]="confirmPassword()"
          [error]="confirmError()"
          [showPasswordToggle]="true"
          (valueChange)="confirmPassword.set($event)"
        />

        @if (state() === 'success') {
          <p class="success">Senha redefinida. Redirecionando para o login...</p>
        }

        <app-ui-button
          label="Redefinir senha"
          loadingLabel="Redefinindo..."
          type="submit"
          [loading]="state() === 'loading'"
          [disabled]="state() === 'success'"
          [showArrow]="true"
        />
      </form>

      <p class="footer-link"><a class="link" routerLink="/login">Voltar ao login</a></p>
    </div>
  </section>
</main>
