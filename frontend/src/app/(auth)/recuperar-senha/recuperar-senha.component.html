<main class="auth-page">
  <app-brand-panel
    kicker="Acesso seguro"
    titulo="Volte para sua rotina de <em>estudos.</em>"
    descricao="Enviaremos um link de recuperação para o e-mail usado no seu cadastro."
  />

  <section class="form-panel">
    <div class="auth-box">
      <h2 class="auth-heading">Recuperar senha.</h2>
      <p class="auth-copy">Informe seu e-mail para receber o link.</p>

      <form class="form" (submit)="handleSubmit($event)">
        <app-ui-input
          label="E-mail"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [value]="email()"
          (valueChange)="email.set($event)"
        />

        @if (state() === 'success') {
          <p class="success">Se este e-mail estiver cadastrado, você receberá as instruções.</p>
        }

        <app-ui-button
          label="Enviar link de recuperação"
          loadingLabel="Enviando..."
          type="submit"
          [loading]="state() === 'loading'"
          [disabled]="state() === 'success'"
          [showArrow]="true"
        />
      </form>

      @if (state() === 'success') {
        <p class="resend-hint resend-hint--standalone">
          Não recebeu o e-mail?
          <button
            type="button"
            class="link"
            [disabled]="resendState() === 'loading' || resendCooldown() > 0"
            (click)="handleResend()"
          >
            @if (resendState() === 'loading') {
              reenviando...
            } @else if (resendCooldown() > 0) {
              reenviar em {{ resendCooldown() }}s
            } @else {
              reenviar e-mail
            }
          </button>
        </p>
      }

      <p class="footer-link"><a class="link" routerLink="/login">Voltar ao login</a></p>
    </div>
  </section>
</main>
