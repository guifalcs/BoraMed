<main class="auth-page">
  <app-brand-panel
    kicker="Para alunos da rede Afya"
    titulo="Treine com questões feitas pra <em>sua prova.</em>"
    descricao="Simulados originais no padrão das avaliações nacionais, processuais (N1/N2) e laboratório (P1/P2). Estude exatamente o que cai."
    [showMetrics]="true"
  />

  <section class="form-panel">
    <div class="auth-box">
      <nav class="auth-tabs" aria-label="Autenticação">
        <a class="auth-tab active" routerLink="/login">Entrar</a>
        <a class="auth-tab" routerLink="/cadastro">Criar conta</a>
      </nav>

      <h2 class="auth-heading">Bem-vindo de volta.</h2>
      <p class="auth-copy">Continue a sua sequência de estudos.</p>

      <form class="form" (submit)="handleSubmit($event)">
        <app-ui-input
          label="E-mail"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [required]="true"
          [value]="email()"
          [error]="emailError()"
          (valueChange)="email.set($event)"
        />

        <app-ui-input
          label="Senha"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          labelActionText="Esqueci a senha"
          labelActionRouterLink="/recuperar-senha"
          [required]="true"
          [value]="password()"
          [error]="passwordError()"
          [showPasswordToggle]="true"
          (valueChange)="password.set($event)"
        />

        <app-ui-button
          label="Entrar"
          loadingLabel="Entrando..."
          type="submit"
          [loading]="state() === 'loading'"
          [showArrow]="true"
        />
      </form>

      <div class="auth-divider"><span>ou continue com</span></div>

      <button class="btn-google" type="button" (click)="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Entrar com Google
      </button>

      <p class="legal">
        Ao continuar você concorda com os <a class="link" href="#">termos de uso</a> e
        <a class="link" href="#">política de privacidade</a>.
      </p>
    </div>
  </section>
</main>
