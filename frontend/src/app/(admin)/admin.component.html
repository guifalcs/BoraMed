<div class="admin-shell" [class.admin-shell--menu-open]="menuAberto()">
  @if (menuAberto()) {
    <button class="admin-sidebar-backdrop" type="button" aria-label="Fechar menu" (click)="fecharMenu()"></button>
  }

  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a routerLink="/admin" class="brand-link">
        <app-ui-icon [icon]="settingsIcon" [size]="18" />
        <span class="brand-text">BoraMed <em>Admin</em></span>
      </a>
      <button class="admin-sidebar-close" type="button" aria-label="Fechar menu" (click)="fecharMenu()">
        <app-ui-icon [icon]="closeIcon" [size]="18" />
      </button>
    </div>

    <nav class="admin-nav" aria-label="Navegação admin">
      @for (item of navItems; track item.route) {
        <a
          class="admin-nav-item"
          [routerLink]="item.route"
          routerLinkActive="admin-nav-item--active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
          (click)="fecharMenu()"
        >
          <app-ui-icon [icon]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="admin-sidebar-footer">
      <a routerLink="/dashboard" class="admin-back-link" (click)="fecharMenu()">
        ← Voltar ao app
      </a>
      <button class="admin-signout-btn" type="button" (click)="handleSignOut()">
        <app-ui-icon [icon]="logOutIcon" [size]="16" />
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <div class="admin-body">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <button class="admin-menu-btn" type="button" aria-label="Abrir menu" (click)="toggleMenu()">
          <app-ui-icon [icon]="menuIcon" [size]="20" />
        </button>
        <span class="admin-badge">Admin</span>
      </div>
      <div class="admin-topbar-right">
        <app-ui-avatar
          [name]="profile()?.nome_completo ?? user()?.email ?? 'Admin'"
          [avatarUrl]="profile()?.avatar_url ?? null"
          size="sm"
        />
        <div class="admin-topbar-user">
          <span class="admin-topbar-name">{{ profile()?.nome_completo ?? user()?.email }}</span>
          @if (profile()?.nome_completo) {
            <span class="admin-topbar-email">{{ user()?.email }}</span>
          }
        </div>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet />
    </main>
  </div>
</div>
