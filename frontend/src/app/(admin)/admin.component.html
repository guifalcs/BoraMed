<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-brand">
      <a routerLink="/admin" class="brand-link">
        <app-ui-icon [icon]="settingsIcon" [size]="18" />
        <span class="brand-text">BoraMed <em>Admin</em></span>
      </a>
    </div>

    <nav class="admin-nav" aria-label="Navegação admin">
      @for (item of navItems; track item.route) {
        <a
          class="admin-nav-item"
          [routerLink]="item.route"
          routerLinkActive="admin-nav-item--active"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
        >
          <app-ui-icon [icon]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="admin-sidebar-footer">
      <a routerLink="/dashboard" class="admin-back-link">
        ← Voltar ao app
      </a>
      <button class="admin-signout-btn" type="button" (click)="handleSignOut()">
        <app-ui-icon [icon]="logOutIcon" [size]="16" />
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <div class="admin-body">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <span class="admin-badge">Admin</span>
      </div>
      <div class="admin-topbar-right">
        <app-ui-avatar
          [name]="profile()?.nome_completo ?? user()?.email ?? 'Admin'"
          [avatarUrl]="profile()?.avatar_url ?? null"
          size="sm"
        />
        <div class="admin-topbar-user">
          <span class="admin-topbar-name">{{ profile()?.nome_completo ?? user()?.email }}</span>
          @if (profile()?.nome_completo) {
            <span class="admin-topbar-email">{{ user()?.email }}</span>
          }
        </div>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet />
    </main>
  </div>
</div>
