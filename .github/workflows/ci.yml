name: CI

# Pipeline de validação. Roda em todo push e PR para garantir que mudanças
# (em especial no fluxo de pagamentos) não quebrem regras de negócio.
on:
  push:
  pull_request:

# Cancela execuções antigas do mesmo ref quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Núcleo financeiro: lógica das edge functions de pagamento (Deno) ──────────
  edge-functions:
    name: Edge functions (pagamento)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # Versão fixa (não `v2.x`): toolchain flutuante já causou falhas
          # intermitentes de type-check em código idêntico.
          deno-version: v2.9.0
      - name: Type-check dos entrypoints de produção
        # `--frozen` garante que o deno.lock commitado é respeitado à risca
        # (sem resolver versões novas de dependências em runtime).
        run: deno check --frozen mp-webhook/index.ts mp-criar-assinatura/index.ts mp-vincular-assinatura/index.ts
      - name: Testes (unitários + integração com fakes)
        run: deno test -A --no-check --frozen

  # ── Banco: invariantes de segurança (gabarito, nota, paywall, RLS) ──────────
  # Sobe o stack local (aplica TODAS as migrations do zero) e valida, por
  # introspecção de catálogo, os privilégios que escondem o gabarito e impedem
  # o aluno de adulterar a própria nota. Esse estado já foi desfeito duas vezes
  # por migrations autogeradas via `db pull` — ver o cabeçalho do arquivo .sql.
  db-security:
    name: DB — invariantes de segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` aplica as migrations em ordem; se alguma quebrar, o
      # job falha aqui — o que também valida migrations escritas à mão.
      - name: Sobe o stack local
        run: supabase start
      - name: Invariantes de gabarito, nota, paywall e RLS
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/grants_gabarito_test.sql
      - name: Invariantes do público de campanha de e-mail
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/campanha_segmento_test.sql
      - name: Diagnóstico do stack em caso de falha
        if: failure()
        run: supabase status || true

  # ── Frontend: testes unitários (Vitest via @angular/build) ───────────────────
  frontend-unit:
    name: Frontend unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # O build de teste usa a config development, que troca environment.ts por
      # environment.local.ts (gitignored). No CI geramos a partir do exemplo.
      - name: Gera environment.local.ts a partir do exemplo
        run: cp src/environments/environment.local.example.ts src/environments/environment.local.ts
      - name: Testes unitários
        run: npm test
        env:
          CI: 'true'

  # ── Frontend: E2E de checkout/retorno (Playwright, backend mockado) ──────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium
      # Só os testes com rede 100% mockada (projeto "mocked"). Os projetos
      # "setup"/"chromium" fazem login real e exigem um backend Supabase local,
      # então ficam de fora do CI (rodam localmente com `supabase start`).
      - name: Testes E2E (pagamento, backend mockado)
        run: npm run test:e2e -- pagamento --project=mocked
        env:
          CI: 'true'
      - name: Sobe o relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
